<!doctype html><html lang="ko"><meta charset="utf-8"><title>Unity 알림 연결</title>
<style>body{width:330px;padding:14px;font:14px sans-serif;background:#182333;color:#f0f4ff}button,input{box-sizing:border-box;width:100%;padding:10px;margin:5px 0}button{cursor:pointer}p{line-height:1.5}#status{color:#9fd9ff;white-space:pre-wrap}</style>
<h3>SmartLEAD → Unity</h3>
<input id="token" type="password" placeholder="Unity에서 복사한 연결 코드" autocomplete="off">
<button id="pair">1. 연결 코드 저장</button>
<button id="pick">2. 알림 목록 영역 선택</button>
<button id="send">3. 현재 목록을 Unity로 보내기</button>
<button id="stop">자동 전달 중지</button>
<p>SmartLEAD에서 로그인하고 알림 목록을 연 뒤 선택하세요. 선택한 목록에 새 링크가 보이면 자동 전달합니다. 새로고침은 직접 해야 합니다.</p>
<p id="status"></p><script src="popup.js"></script></html>
